# Author: Gorla Poojitha
name: Fetch BRL-USD exchange rates

on:
  schedule:
    - cron: "0 6 * * 1"   # every Monday at 06:00 UTC
  workflow_dispatch:       # adds a "Run workflow" button on GitHub

permissions:
  contents: write          # allows the job to commit the updated CSV

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch rates
        run: python ingestion/fetch_rates.py

      - name: Commit the CSV if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/external/brl_usd_rates.csv
          git diff --staged --quiet || git commit -m "Update BRL-USD exchange rates"
          git push
